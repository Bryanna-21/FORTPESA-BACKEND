name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fortpesa
          POSTGRES_PASSWORD: fortpesa
          POSTGRES_DB: fortpesa_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fortpesa -d fortpesa_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fortpesa:fortpesa@localhost:5432/fortpesa_platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      API_KEY_PEPPER: ci-test-api-key-pepper
      SESSION_SECRET: ci-test-session-secret
      FORTPESA_API_KEY: ci-test-fortpesa-key
      FORTPESA_WEBHOOK_SECRET: ci-test-webhook-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Sync test database schema
        run: npx prisma db push --accept-data-loss

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
